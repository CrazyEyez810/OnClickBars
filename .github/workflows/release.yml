name: Release

# Each addon is released by its own tag:
#   OneClickBars-v1.7.0  packages OneClickBars/
#   OneClickXP-v1.0.0    packages OneClickXP/
#   OneClickPace-v0.1.0  packages OneClickPace/
on:
  push:
    tags:
      - "OneClickBars-v*"
      - "OneClickXP-v*"
      - "OneClickPace-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The packager needs the addon at the root of a git checkout, so copy
      # the tagged addon's folder into a small repo with the same tag.
      - name: Stage the addon named in the tag
        run: |
          dir="${GITHUB_REF_NAME%%-v*}"
          [ -d "$dir" ] || { echo "No folder named $dir"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pkg"
          cp -R "$dir"/. "$RUNNER_TEMP/pkg/"
          cd "$RUNNER_TEMP/pkg"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git add -A
          git -c user.name="release" -c user.email="release@users.noreply.github.com" commit -qm "$GITHUB_REF_NAME"
          git tag "$GITHUB_REF_NAME"
      - uses: BigWigsMods/packager@v2
        with:
          args: -t ${{ runner.temp }}/pkg -n "{project-version}"
