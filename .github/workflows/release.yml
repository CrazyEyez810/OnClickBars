name: Release

# Each addon is released by its own tag:
#   OneClickBars-v1.7.0  packages OneClickBars/
#   OneClickXP-v1.0.0    packages OneClickXP/
on:
  push:
    tags:
      - "OneClickBars-v*"
      - "OneClickXP-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the addon from the tag
        id: addon
        run: echo "dir=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
      - uses: BigWigsMods/packager@v2
        with:
          args: -t ${{ steps.addon.outputs.dir }} -n "{project-version}"
